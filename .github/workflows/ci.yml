# CI contract (see README § CI/CD):
# - unit + playwright: required on every push/PR (PR gating).
# - integration: intentionally excluded from PR gating — flaky on live prod data.
#   Run manually: Actions → CI → Run workflow. Smoke (header, sitemap, crawl contract)
#   remains mandatory on every PR.

name: CI

env:
  BASE_URL: https://bestprice.com.ua
  TEST_ENV: prod
  TEST_PRODUCT_SLUG: otvertka-49108-stal-sl5x75

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:header
      - run: npm run test:sitemap
        env:
          SITEMAP_LIMIT: 25
      - run: npx playwright test tests/e2e/crawl.smoke.spec.ts

  integration:
    runs-on: ubuntu-latest
    # Not PR-gated: strict live-site crawl (OK + price match). See README.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
