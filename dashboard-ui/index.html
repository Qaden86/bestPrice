<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crawl Dashboard</title>

    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <!-- Trace modal -->
    <div id="traceModal" style="display: none"></div>

    <div class="page">
      <!-- TOPBAR -->
      <div class="topbar">
        <div>
          <h1>Crawl Dashboard</h1>
          <p class="subtitle">BestPrice Monitoring System</p>
        </div>

        <div class="live">
          <div class="live-dot"></div>
          LIVE
        </div>
      </div>

      <!-- STATS -->
      <div id="stats" class="stats"></div>

      <!-- INSIGHTS: top failing steps + trace bucket distribution -->
      <div id="insights" class="insights"></div>

      <!-- TOOLBAR -->
      <div class="toolbar">
        <input id="search" placeholder="Search URL..." />

        <select id="statusFilter">
          <option value="">All statuses</option>
          <option value="OK">OK</option>
          <option value="FAIL">FAIL</option>
          <option value="ERROR">ERROR</option>
        </select>

        <select id="reasonFilter">
          <option value="">All reasons</option>
        </select>

        <select id="runSelect" title="View run">
          <option value="current">Current run</option>
        </select>

        <select id="compareRunSelect" title="Compare with previous run">
          <option value="">Compare with…</option>
        </select>
      </div>

      <div id="compareBanner" class="compare-banner" style="display: none"></div>

      <!-- TABLE -->
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Status</th>
              <th>URL</th>
              <th>PDP</th>
              <th>Cart</th>
              <th>Diff</th>
              <th>Reason</th>
            </tr>
          </thead>

          <tbody id="table"></tbody>
        </table>
      </div>

      <!-- PAGINATION -->
      <div id="pagination" class="pagination"></div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
