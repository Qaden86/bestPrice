<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Crawl Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <div class="container">
      <h1>Crawl Dashboard</h1>

      <div id="stats" class="stats"></div>

      <div class="filters">
        <input id="search" placeholder="Search URL..." />
        <input id="minPrice" placeholder="Min price" />
        <input id="maxPrice" placeholder="Max price" />
        <button onclick="applyFilters()">Apply</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Status</th>
            <th>URL</th>
            <th>PDP</th>
            <th>Cart</th>
            <th>Match</th>
            <th>Reason</th>
          </tr>
        </thead>

        <tbody id="table"></tbody>
      </table>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
