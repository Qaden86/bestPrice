<!DOCTYPE html>
<html>
<head>
    <title>Crawl Report</title>

    <style>
        body {
          font-family: Arial, sans-serif;
          padding: 20px;
        }

        table {
          border-collapse: collapse;
          width: 100%;
        }

        th, td {
          border: 1px solid #ccc;
          padding: 8px;
          text-align: left;
        }

        th {
          background: #f5f5f5;
        }

        .ok {
          background: #d4edda;
        }

        .error {
          background: #f8d7da;
        }
    </style>
</head>

<body>

<h1>Crawl Report</h1>

<div id="stats"></div>

<br>

<table>
    <thead>
    <tr>
        <th>Status</th>
        <th>URL</th>
        <th>PDP</th>
        <th>Cart</th>
        <th>Match</th>
        <th>Reason</th>
    </tr>
    </thead>

    <tbody id="rows"></tbody>
</table>

<script>
    async function load() {
      const res = await fetch('/api/results');

      const data = await res.json();

      console.log('[DEBUG UI DATA]', data);

      const success = data.filter(r => r.status === 'OK').length;
      const failed = data.filter(r => r.status === 'ERROR').length;

      document.getElementById('stats').innerHTML = `
        <b>Success:</b> ${success}
        <br>
        <b>Failed:</b> ${failed}
        <br><br>
      `;

      const rows = data.map(r => `
        <tr class="${r.status === 'OK' ? 'ok' : 'error'}">
          <td>${r.status}</td>

          <td>
            <a href="${r.url}" target="_blank">
              URL
            </a>
          </td>

          <td>${r.pdpPrice ?? '-'}</td>

          <td>${r.cartPrice ?? '-'}</td>

          <td>
            ${
              r.priceMatch === true
                ? '✅'
                : r.priceMatch === false
                ? '❌'
                : '-'
            }
          </td>

          <td>${r.reason ?? '-'}</td>
        </tr>
      `).join('');

      document.getElementById('rows').innerHTML = rows;
    }

    window.addEventListener('DOMContentLoaded', load);
</script>

</body>
</html>
